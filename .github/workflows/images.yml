name: images

# Builds the two container images the production compose pulls
# (mytheus-platform/deploy/compose.prod.yml, `realtime` profile). Mirrors the `docker` job in
# mytheus-backend/.github/workflows/ci.yml.
#
# Pull requests build but never push: a PR can come from a fork, and pushing an unreviewed image
# to the `main` tag the VPS pulls would be a supply-chain hole. Pushes to main publish.
# No PAT: the built-in GITHUB_TOKEN pushes to GHCR given `packages: write`.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mytheus-realtime-gateway
            dockerfile: services/realtime-gateway/Dockerfile
          - name: mytheus-transcription
            dockerfile: services/transcription-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          # Repo root: the .dockerignore there keeps every env file out of both images.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # The SHA tag is the immutable artifact to pin or roll back to; `main` is the moving
          # pointer the deploy follows.
          tags: |
            ghcr.io/mytheus-ai/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/mytheus-ai/${{ matrix.name }}:main
          # One cache scope per image so the two builds do not evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
