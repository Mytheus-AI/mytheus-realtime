[project]
name = "transcription-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "confluent-kafka[avro,schemaregistry]>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.7",
    "grpcio>=1.63",
    "protobuf>=5.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_service"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# So `tests/test_partition_privileges.py` can `from migrations._partition_privileges import
# APPLICATION_ROLES` -- `migrations/` is a top-level package (repo root, alongside `src/`),
# not part of the installed `transcription_service` package, so it needs the repo root on
# `sys.path` explicitly. Alembic's own `prepend_sys_path = .` in `alembic.ini` does the same
# thing for the migration runner itself.
pythonpath = ["."]
